name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    # Pinned, not `ubuntu-latest`. GitHub rolled that label to Ubuntu 26.04 and
    # the Playwright version this repo locks (1.60.0) does not know that
    # platform, so `playwright install --with-deps chromium` fails outright:
    #
    #   Cannot install dependencies for ubuntu26.04-x64 with Playwright 1.60.0!
    #   ERROR: Playwright does not support chromium on ubuntu26.04-x64
    #
    # Nothing in the repo changed -- the image moved. main only looks green
    # because it has not re-run since 2026-10-21.
    #
    # Playwright added 26.04 support in 1.61.0 (verified by grepping the
    # published manylinux wheels: 1.60.0 has no occurrence of `ubuntu26.04`,
    # 1.61.0 has 28). Raising the floor in pyproject.toml and relocking is the
    # other half of this and belongs in its own change, where the test suite
    # can vouch for the newer browser build. Until then this is the version of
    # Ubuntu the locked Playwright actually supports.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Playwright browsers
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Run tests
        run: uv run --no-sync python -m pytest tests/ -v --tb=short

  helm-lint:
    # Pinned for the same reason as the test job above: a floating runner image
    # is a dependency that changes without a commit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm chart against every environment override
        run: make helm.lint
